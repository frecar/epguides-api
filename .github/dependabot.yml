version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    allow:
      - dependency-type: "all"
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/docs"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps-docs"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      - dependency-name: "actions/checkout"
      - dependency-name: "docker/login-action"

  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "python"
        versions:
          - ">= 3.15.0.a"
