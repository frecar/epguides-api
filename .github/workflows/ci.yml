name: EPGuides API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keyed on the PR number when present (always distinct from any
# push-to-main group) instead of github.ref alone, so a delayed
# pull_request run can never collide with, and cancel, a push run on
# main. push events fall through to github.ref unchanged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default for the whole workflow. Every
# job here is read-only — checkout, lint, type-check, test, dependency
# audit, Docker build (push: false), and Trivy fs/image scans. None
# post PR comments, push pages, push an image, or cut a release, so no
# job needs a write escalation. The trivy-fs / docker-build /
# trivy-image jobs keep their own explicit `permissions: { contents:
# read }` as documentation; this top-level block makes the read-only
# floor the default for jobs that don't restate it, rather than relying
# on the broad ambient `GITHUB_TOKEN` permissions.
permissions:
  contents: read

env:
  CI_FLEET_UNTRUSTED_ENABLED: ${{ vars.CI_FLEET_UNTRUSTED_ENABLED }}
  CI_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
  CI_QUALIFIED_DOCKER_CAPACITY: ${{ vars.CI_FLEET_UNTRUSTED_LINUX_DOCKER_X64_COMPATIBLE_CAPACITY }}
  PYTHONHASHSEED: "0"

jobs:
  audit:
    name: Security Audit
    # GitHub-hosted runner. This is a public repo: a fork PR can run
    # arbitrary code in CI, so every pull_request-reachable job runs on an
    # ephemeral, network-isolated GitHub-hosted runner rather than a
    # self-hosted one. The image-build jobs below authenticate their
    # Docker Hub base-image pulls with a read-only token (when available)
    # to avoid the anonymous pull-rate limit on a hosted runner.
    runs-on: ubuntu-latest
    # Bounded ceiling so a wedged self-hosted runner (hung network pull
    # in pip-audit / uv export, or any stuck step) fails the job instead
    # of holding a shared runner for the GitHub default 6h. Sized above
    # normal duration so it only trips on a real hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Private reference check
        run: bash scripts/check-no-internal-refs.sh

      - name: Non-public Git dependency check
        run: |
          python3 scripts/check_no_private_git_deps.py
          python3 scripts/check_no_private_git_deps.py --self-test

      - name: Isolate uv cache
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          prune-cache: true

      - name: Export deps to requirements.txt (third-party only)
        # epguides-api is not published to PyPI, so we can't audit the
        # venv directly (pip-audit errors on the unpublished first-party
        # entry). Export ALL transitive deps to a hashed requirements.txt
        # and audit that file instead — gives us the same third-party
        # CVE coverage without confusing pip-audit.
        run: uv export --frozen --no-dev --no-emit-project --output-file=/tmp/requirements-audit.txt

      - name: Audit
        # No --ignore-vuln entries. All previously-ignored CVEs now have
        # upstream fixes that ship in the lockfile. Anything surfacing
        # here is an actual vuln that needs an upgrade, not a silenced
        # workaround.
        run: uvx pip-audit --strict --desc --require-hashes -r /tmp/requirements-audit.txt

      - name: Security audit (OSV-Scanner)
        # Authoritative ONLINE dependency-CVE backstop. The local
        # `scripts/audit_osv.sh` pre-push hook shifts this same verdict
        # left (it warn-skips offline); this CI step is the source of
        # truth that always runs against the live osv.dev advisory DB.
        # All ignores live in .osv-scanner.toml with a mandatory
        # ignoreUntil + reason + reviewer comment — NO --ignore-vuln CLI
        # flags. Orthogonal to pip-audit above: pip-audit scans the
        # exported hashed requirements.txt, OSV-Scanner reads the uv.lock
        # resolved graph directly — overlapping osv.dev coverage with
        # independent parsers, so a miss in one parser is caught by the
        # other.
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=uv.lock
            --config=.osv-scanner.toml

  lint:
    name: Lint
    # Portable job: only use the isolated public route after its rollout flag is enabled.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]') || (vars.CI_FLEET_UNTRUSTED_ENABLED == 'true' && '["fleet-pooled-untrusted-linux"]') || '["ubuntu-latest"]') }}
    # Bounded ceiling so a wedged runner fails fast instead of holding a
    # shared self-hosted runner for the GitHub default 6h.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate uv cache
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          prune-cache: true

      - name: Sync dev dependencies
        run: uv sync --frozen --only-dev

      - name: Run ruff check
        run: uv run ruff check app/

      - name: Run ruff format check
        run: uv run ruff format --check app/

      - name: Configured LLM endpoint check
        run: python3 scripts/check_no_external_llm.py

      - name: Base image digest-pin check
        # Fail-closed: every external image a Dockerfile pulls (FROM + COPY
        # --from) must be pinned by `tag@sha256:` so the build is reproducible
        # and a mutated upstream tag can't be adopted silently. Stdlib-only +
        # docker-less, so it also runs in `make ci-parity` / pre-commit.
        run: python3 scripts/check_base_image_digest_pin_drift.py

      - name: CI resource-sizing guard
        # Fail-closed: no workflow step may hardcode a topology-specific
        # worker/CPU/memory ceiling (`pytest -n 16`, `--maxprocesses=16`,
        # `--memory=8g`). A literal number only ever matches the runner it
        # was tuned on; the value must instead be derived from whatever
        # capacity the assigned runner reports at run time (`auto` /
        # `logical` / a computed fraction of scheduler-visible CPU or
        # memory). Stdlib-only, so it also runs in `make ci-parity` /
        # pre-commit.
        run: python3 scripts/check_ci_resource_sizing.py

      - name: Host-interpreter syntax guard (Python 3.12)
        # Everything under scripts/ is run by the system `python3` (a
        # developer's machine / CI runner, possibly older than 3.14) via the
        # `language: system` pre-commit hooks + `make ci-parity`, NOT the 3.14
        # `uv` venv. The repo's `requires-python >=3.14` + ruff
        # `target-version=py314` mean the 3.14 toolchain (and `ruff format`)
        # will happily emit 3.14-only syntax — e.g. rewrite `except (A, B):`
        # into PEP 758 `except A, B:`, which is a SyntaxError on Python < 3.14.
        # This step compiles every host-run script under a real CPython 3.12
        # (`--no-project` sidesteps the `requires-python >=3.14` gate —
        # py_compile needs only the interpreter grammar, no project deps). The
        # ruff `per-file-target-version` py312 override in pyproject.toml is
        # the fast lint+format layer; this is the authoritative compile
        # backstop.
        run: uv run --python 3.12 --no-project python -m py_compile scripts/*.py ci_shard_helper/*.py

  typecheck:
    name: Type Check
    # Portable job: only use the isolated public route after its rollout flag is enabled.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]') || (vars.CI_FLEET_UNTRUSTED_ENABLED == 'true' && '["fleet-pooled-untrusted-linux"]') || '["ubuntu-latest"]') }}
    # Bounded ceiling so a wedged runner fails fast instead of holding a
    # shared self-hosted runner for the GitHub default 6h.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate uv cache
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run mypy
        run: uv run mypy app/ --config-file pyproject.toml --exclude 'app/tests/'

  # The default stays one hosted job. Parallel collection only starts after
  # explicit isolated-Docker qualification; fork contributions stay hosted.
  test-plan:
    if: vars.CI_FLEET_UNTRUSTED_ENABLED == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    services:
      redis:
        image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require qualified isolated Docker x64 capacity
        run: python3 scripts/ci_pytest_shards.py capacity
      - name: Isolate uv cache
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          prune-cache: true
      - run: uv sync --frozen
      - name: Collect complete native cases and bind the shard plan
        id: plan
        run: uv run python scripts/ci_pytest_shards.py plan --directory "${RUNNER_TEMP}/pytest-plan"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pytest-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest-plan/
          if-no-files-found: error
          retention-days: 1

  test-shard:
    needs: test-plan
    if: needs.test-plan.result == 'success'
    # The literal capability is independently qualified before promotion.
    runs-on: ${{ fromJSON(vars.CI_FLEET_UNTRUSTED_ENABLED == 'true' && '["fleet-pooled-untrusted-linux-docker-x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-plan.outputs.shards) }}
    services:
      redis:
        image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate uv cache
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          prune-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pytest-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest-plan
      - name: Run exactly the assigned cases and seal coverage bytes
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: uv run python scripts/ci_pytest_shards.py run --directory "${RUNNER_TEMP}/pytest-plan" --shard "${CI_SHARD}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pytest-shard-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-plan/artifacts/shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test
    # Always arbitrate expected/skipped paths; missing/cancelled shards fail.
    needs: [test-plan, test-shard]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every expected execution job
        env:
          CI_PLAN_RESULT: ${{ needs.test-plan.result }}
          CI_SHARDS_RESULT: ${{ needs.test-shard.result }}
        run: python3 scripts/ci_pytest_shards.py gate
      - name: Isolate uv cache
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          prune-cache: true
      - run: uv sync --frozen
      - name: Run hosted default/fork suite with complete sealed evidence
        if: env.CI_FLEET_UNTRUSTED_ENABLED != 'true' || env.CI_FORK_PR != 'false'
        # The tracked invocation retains -n auto and the existing CPU/RAM
        # selector/Redis DB isolation. The final complete report enforces 95%.
        run: uv run python scripts/ci_pytest_shards.py single --directory "${RUNNER_TEMP}/pytest-evidence"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: env.CI_FLEET_UNTRUSTED_ENABLED == 'true' && env.CI_FORK_PR == 'false'
        with:
          name: pytest-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest-plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: env.CI_FLEET_UNTRUSTED_ENABLED == 'true' && env.CI_FORK_PR == 'false'
        with:
          pattern: pytest-shard-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/pytest-artifacts
      - name: Verify every native receipt and sealed artifact at the 95% floor
        if: env.CI_FLEET_UNTRUSTED_ENABLED == 'true' && env.CI_FORK_PR == 'false'
        run: uv run python scripts/ci_pytest_shards.py combine --directory "${RUNNER_TEMP}/pytest-plan" --artifacts "${RUNNER_TEMP}/pytest-artifacts"

  # The three jobs below (trivy-fs, docker-build, trivy-image) are a managed
  # copy kept byte-identical to the canonical CI template. Hand-edits between
  # the markers are overwritten by the next template sync; change the canonical
  # template (and re-run the drift check) instead. The drift check compares only
  # the region between the markers, so the rest of this workflow stays freely
  # editable.
  # ===== BEGIN managed-public-ci-template: ci-trivy-buildx — DO NOT HAND-EDIT =====
  # Trivy fs scan. Standalone job here so PR/push runs gate on it via
  # ci-gate. The companion .github/workflows/trivy-fs-nightly.yml owns
  # the 03:30 UTC schedule trigger independently so scheduled sweeps
  # do not conflate with PR signal.
  #
  # Two-step gating: a single step with `severity: "CRITICAL,HIGH"` +
  # `exit-code: "1"` gates on BOTH severities (the `exit-code` applies
  # to ANY finding matching the `severity` filter). Splitting into two
  # steps lets CRITICAL hard-gate and HIGH stay annotation-only:
  #   step 1: severity=CRITICAL, exit-code=1                  → blocks merge
  #   step 2: severity=HIGH, exit-code=0, if: always()        → surfaces findings only
  #
  # `if: always()` on the HIGH step is load-bearing: without it, a
  # CRITICAL failure skips the HIGH-annotation step entirely, which
  # would actually weaken HIGH visibility compared to the previous
  # single-step form.
  trivy-fs:
    name: Trivy fs scan
    # GitHub-hosted — public-repo fork-PR isolation (see `audit` above).
    runs-on: ubuntu-latest
    # Bounded ceiling so a wedged runner (hung Trivy DB pull or stuck
    # scan) fails fast instead of holding a shared self-hosted runner
    # for the GitHub default 6h.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install Trivy into a per-job directory on the runner's local temp
      # space. setup-trivy's default install path ($HOME/.local/bin/trivy-bin)
      # is shared across concurrent jobs on a self-hosted runner host, so one
      # job writing the binary while another execs it raises ETXTBSY ("Text
      # file busy", exit 126). ${{ runner.temp }} is unique per job and on
      # local disk, so there is no shared write/exec target to race on.
      - name: Install Trivy (per-job, isolated binary)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0 # keep in sync with aquasecurity/trivy-action@v0.36.0
          cache: true
          path: ${{ runner.temp }}
      - name: Put the per-job Trivy on PATH
        run: echo "${{ runner.temp }}/trivy-bin" >> "$GITHUB_PATH"
      - name: Trivy fs scan — CRITICAL (gates merge)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true # use the per-job Trivy installed above
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL"
          exit-code: "1"
          # Suppress findings with no upstream fix available — those
          # are noise we cannot act on (`bump the dep` is the only
          # real remediation, and there is nothing to bump to).
          ignore-unfixed: true
          format: "table"
          trivyignores: ".trivyignore"
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
      - name: Trivy fs scan — HIGH (annotation only)
        # `if: always()` so a CRITICAL failure above does not suppress
        # HIGH visibility — policy is "CRITICAL gates, HIGH informs",
        # not "CRITICAL gates, HIGH only-shown-when-clean".
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true # use the per-job Trivy installed above
          scan-type: "fs"
          scan-ref: "."
          # exit-code=0 — HIGH surfaces in the run log but does NOT
          # gate. Avoids base-image noise creating bypass culture.
          severity: "HIGH"
          exit-code: "0"
          ignore-unfixed: true
          format: "table"
          trivyignores: ".trivyignore"
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

  # Build the declared production recipes once and scan their immutable IDs.
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      image_ids: ${{ steps.production.outputs.image-ids }}
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          use: false
          cleanup: true
      - name: Build production Compose images once
        id: production
        env:
          COMPOSE_FILES: docker-compose.prod.yml
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash scripts/compose_build.sh build
      - name: Install Trivy (per-job, isolated binary)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true
          path: ${{ runner.temp }}
      - name: Put the per-job Trivy on PATH
        run: echo "${{ runner.temp }}/trivy-bin" >> "$GITHUB_PATH"
      - name: Prepare the job-local vulnerability database
        id: database
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: trivy image --download-db-only --cache-dir "$TRIVY_CACHE_DIR" --timeout 10m
      - name: Trivy image scan — CRITICAL (gates merge)
        id: scan_critical
        env:
          IMAGE_IDS: ${{ steps.production.outputs.image-ids }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: bash scripts/compose_build.sh scan CRITICAL
      - name: Trivy image scan — HIGH (annotation only)
        id: scan_high
        if: ${{ always() && steps.production.outcome == 'success' && steps.database.outcome == 'success' }}
        env:
          IMAGE_IDS: ${{ steps.production.outputs.image-ids }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: bash scripts/compose_build.sh scan HIGH
      - name: Remove job-owned image tags
        if: always()
        env:
          IMAGE_TAGS: ${{ steps.production.outputs.image-tags || '[]' }}
        run: bash scripts/compose_build.sh cleanup

  # Preserve the existing required build context with a receipt from the same
  # successful build-and-scan job, without building the image a second time.
  docker-build:
    name: Docker build
    needs: [trivy-image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Verify production build and scan receipt
        env:
          IMAGE_JOB_RESULT: ${{ needs.trivy-image.result }}
          IMAGE_IDS: ${{ needs.trivy-image.outputs.image_ids }}
        run: |
          set -euo pipefail
          test "$IMAGE_JOB_RESULT" = success
          python3 - <<'PYTHON'
          import json
          import os
          import re
          ids = json.loads(os.environ["IMAGE_IDS"])
          if not isinstance(ids, list) or not ids or any(not isinstance(value, str) or not re.fullmatch(r"sha256:[a-f0-9]{64}", value) for value in ids):
              raise SystemExit("missing or invalid production image receipt")
          PYTHON
  # ===== END managed-public-ci-template: ci-trivy-buildx =====

  gitleaks:
    # INTENTIONAL PUBLIC-REPO EXEMPTION: keep this credential-less,
    # self-contained implementation. Public fork PRs cannot consume private
    # shared actions, so this job must not be consolidated with the private
    # consumers' canonical implementation.
    # Server-side secret-scanning BACKSTOP to the local `gitleaks` pre-commit
    # hook. The local hook scans the STAGED diff at commit time but is
    # bypassable (`git commit --no-verify`, `SKIP=gitleaks`, commenting out the
    # hook); this job re-runs gitleaks on the PR so a bypassed local hook is
    # still caught before merge. It reuses the SAME vendored `.gitleaks.toml`
    # (no CI-vs-local divergence) and is wired into `ci-gate` below so a
    # detected secret blocks the merge.
    #
    # NOT path-filtered — it always runs, so it never reports `skipped` and is
    # safe in ci-gate's `needs` regardless of which files a PR touches.
    #
    # SCOPE = PR-diff range, not full-tree: the gate catches a NEWLY-introduced
    # secret. A pre-existing committed secret must be rotated, not turned into
    # an unrelated-PR blocker. A periodic full-history sweep is a separate
    # concern.
    #
    # IMPLEMENTATION = pinned CLI binary from GitHub Releases (version +
    # SHA256), NOT `gitleaks/gitleaks-action`: the Docker action pulls an image
    # (Docker-Hub pull-rate-limit pain) and trips org-license checks. The scan
    # itself is a local git op — no network once the binary is in place.
    #
    # Portable job: only use the isolated public route after its rollout flag is enabled.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]') || (vars.CI_FLEET_UNTRUSTED_ENABLED == 'true' && '["fleet-pooled-untrusted-linux"]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR base commit is present for the range scan.
          fetch-depth: 0

      - name: Install pinned gitleaks
        # v8.30.1 matches the `gitleaks/gitleaks` `rev` pinned in
        # .pre-commit-config.yaml — keep the two in lockstep so CI == local.
        # When bumping the hook, bump GITLEAKS_VERSION + GITLEAKS_SHA256 here in
        # the same PR (SHA256 = linux_x64 tarball digest from checksums.txt).
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          # One alternate transport after a failed release URL (epguides-api#578).
          # The immutable platform checksum below covers either response.
          if ! curl -fsSL --connect-timeout 10 --max-time 60 -o "${tmp}/${tarball}" "${url}"; then
            echo "::warning::Release download failed; trying the pinned release REST asset"
            asset_id="$(gh api "repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}" \
              --jq "[select(.tag_name == \"v${GITLEAKS_VERSION}\") | .assets[] | select(.name == \"${tarball}\" and .state == \"uploaded\")] | if length == 1 then .[0].id else error(\"expected one uploaded pinned asset\") end")"
            case "${asset_id}" in
              ''|0|*[!0-9]*) echo "::error::Invalid pinned release asset identity" >&2; exit 1 ;;
            esac
            gh api "repos/gitleaks/gitleaks/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > "${tmp}/${tarball}"
          fi
          echo "${GITLEAKS_SHA256}  ${tmp}/${tarball}" | sha256sum -c -
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" gitleaks
          install -m 0755 "${tmp}/gitleaks" "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
          rm -rf "${tmp}"

      - name: Scan PR diff for secrets
        # Range = base..head on pull_request, before..after on push to main.
        # Use head.sha (NOT github.sha, the synthetic merge commit on PR events)
        # so we scan exactly the contributor's commits. On a push whose `before`
        # is the zero-SHA (new branch / first push / force-push to an unknown
        # parent), fall back to scanning HEAD's working tree so the gate never
        # silently no-ops.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          common=(--config .gitleaks.toml --redact --no-banner --verbose)
          if [ "${GH_EVENT}" = "pull_request" ]; then
            echo "Scanning PR range ${PR_BASE_SHA}..${PR_HEAD_SHA}"
            gitleaks git "${common[@]}" --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "${GH_EVENT}" = "push" ] && [ -n "${PUSH_BEFORE}" ] \
               && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            echo "Scanning push range ${PUSH_BEFORE}..${GITHUB_SHA}"
            gitleaks git "${common[@]}" --log-opts="${PUSH_BEFORE}..${GITHUB_SHA}"
          else
            echo "No usable base commit (new branch / first push); scanning working tree"
            gitleaks dir . "${common[@]}"
          fi

  # Aggregate gate. This is the single required check
  # branch protection keys off, so it must run on EVERY outcome and
  # treat ANYTHING that is not a clean success across all `needs` jobs
  # as a hard fail. `if: always()` guarantees the gate itself always
  # runs and reports a definitive pass/fail status (a job that is
  # itself skipped reports `skipped`, which some branch-protection
  # configs misread as success — so the gate must never be allowed to
  # skip).
  #
  # The assertion catches all three non-success `needs.*.result`
  # values, because `contains(needs.*.result, 'failure')` alone is the
  # classic GitHub Actions gating foot-gun:
  #   - `failure`   — a job failed outright.
  #   - `cancelled` — runner killed mid-run, or a concurrency cancel
  #     landed. A cancelled job never reports `failure`, so a
  #     `failure`-only gate would go green while a mandatory check did
  #     not actually pass.
  #   - `skipped`   — an upstream `needs` dependency did not run (e.g.
  #     its own dependency was cancelled, cascading a skip). A skipped
  #     required job is NOT a passed one, so the gate fails on it too.
  #
  # Test always arbitrates the conditional planning/shard paths itself.
  # Every required result below must still be success; intentional skips
  # belong only to the internal paths that Test explicitly verifies.
  ci-gate:
    if: always()
    needs: [audit, lint, typecheck, test, trivy-fs, docker-build, trivy-image, gitleaks]
    # Keep aggregation on the isolated public route only after its rollout flag is enabled.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]') || (vars.CI_FLEET_UNTRUSTED_ENABLED == 'true' && '["fleet-direct-untrusted-linux"]') || '["ubuntu-latest"]') }}
    # Bounded ceiling — this gate only checks `needs.*.result` and exits,
    # so it should finish in seconds.
    timeout-minutes: 10
    steps:
      - name: Assert all required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "CI failed: one or more required jobs did not succeed."
          echo "Results: ${{ join(needs.*.result, ', ') }}"
          exit 1
