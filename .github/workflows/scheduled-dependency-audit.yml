name: Scheduled dependency audit

# OSV-Scanner runs per-PR in ci.yml, which catches a vulnerability a PR
# INTRODUCES and nothing else. A repo with no PR activity accumulates live CVEs
# silently, and a red default branch is discovered only when somebody happens to
# open the next PR.
#
# That is not hypothetical: five fixable CVEs were recently found live across
# several projects — django 6.0.7 (PYSEC-2026-3717) and sqlparse 0.5.5 (four of
# them, two at CVSS 8.7) — and surfaced only because one turned an unrelated
# feature PR red. Dependency maintenance should be a cycle, not chance discovery.
#
# The scan arguments are byte-identical to the per-PR job in ci.yml on purpose.
# Two scanners disagreeing is worse than one: a scheduled audit scanning a
# different lockfile set or config would be green while CI was red, with no way
# to tell which was authoritative. Scanning through .osv-scanner.toml also means
# deliberately-suppressed findings stay suppressed.

on:
  schedule:
    # Off the hour on purpose: :00 is when every other cron fires.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-dependency-audit
  cancel-in-progress: false

jobs:
  scheduled-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit dependencies (OSV-Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=uv.lock
            --config=.osv-scanner.toml
