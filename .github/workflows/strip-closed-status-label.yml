name: EPGuides API strip closed-issue status label

# A closed issue must never carry an active status:* label
# (triage/ready/in-progress/blocked/burn-in) — a status-scoped search, a project
# board rollup, or automated issue selection should never surface a closed issue
# as live work.
#
# Deliberately same-repo scoped: `issues: closed` is a per-repo event, so this
# only ever sees issues closing in THIS repo. It therefore needs no extra
# credential — the default GITHUB_TOKEN can label its own repo's issues, which
# is all this handler ever touches. Both `gh issue close` and a merged pull
# request's `Closes #N` auto-close fire the same event.
#
# Matches BY PREFIX on whatever status:* labels the issue actually carries,
# rather than a hardcoded list of canonical names, so it self-activates if the
# taxonomy changes. No checkout and no dependency install: GitHub API only.

on:
  issues:
    types: [closed]

permissions:
  issues: write

# One run per issue — an issue closing and reopening rapidly must not race two
# label-removal runs against each other.
concurrency:
  group: strip-closed-status-label-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  strip-status-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove active status:* labels from the closed issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          labels=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '.labels[].name')
          # `|| true`: no status:* label is the common case, not an error —
          # grep's no-match exit 1 would otherwise abort the run under pipefail
          # on every closed issue that carries no status label.
          echo "$labels" | grep '^status:' | while IFS= read -r label; do
            [ -z "$label" ] && continue
            echo "Removing label: $label"
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$label"
          done || true
