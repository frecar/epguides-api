name: Dependabot Auto-Merge

on:
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ${{ fromJSON((vars.CI_FLEET_UNTRUSTED_ENABLED == 'true' && '["fleet-direct-untrusted-linux"]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve patch and minor updates
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.package-ecosystem != 'docker'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch and minor updates
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.package-ecosystem != 'docker'
        run: gh pr merge --squash --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rebase-stale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON((vars.CI_FLEET_UNTRUSTED_ENABLED == 'true' && '["fleet-direct-untrusted-linux"]') || '["ubuntu-latest"]') }}
    steps:
      - name: Rebase behind-main dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --author "app/dependabot" --state open \
            --json number,autoMergeRequest,mergeStateStatus \
            | jq -r '.[] | select(.autoMergeRequest != null and .mergeStateStatus == "BEHIND") | .number' \
            | while read -r pr; do
                echo "Rebasing behind-main PR #$pr"
                gh pr update-branch "$pr" || echo "  (update-branch failed for #$pr, will retry next sweep)"
              done
