name: Dependabot Auto-Merge

on:
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  GH_REPO: ${{ github.repository }}

jobs:
  auto-merge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve patch and minor updates
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.package-ecosystem != 'docker'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch and minor updates
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.package-ecosystem != 'docker'
        run: gh pr merge --squash --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rebase-stale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Rebase behind-main dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --author "app/dependabot" --state open \
            --json number,autoMergeRequest,mergeStateStatus \
            | jq -r '.[] | select(.autoMergeRequest != null and .mergeStateStatus == "BEHIND") | .number' \
            | while read -r pr; do
                echo "Rebasing behind-main PR #$pr"
                gh pr update-branch "$pr" || echo "  (update-branch failed for #$pr, will retry next sweep)"
              done

  recover-main-ci:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: recover-main-ci
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch CI when the current main commit has no run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          run_ids="$(gh api --method GET --paginate "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f head_sha="$main_sha" \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id')"
          if [[ -z "$run_ids" ]]; then
            gh workflow run ci.yml --ref main
          fi
