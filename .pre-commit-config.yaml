repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-toml
      - id: check-ast
        language_version: python3.14
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
        language_version: python3.14
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: local
    hooks:
      - id: ruff
        name: ruff (uv run)
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format (uv run)
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: update-version
        name: Update version number
        entry: bash -c 'echo $(($(git rev-list --count HEAD) + 1)) > VERSION && git add VERSION'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: tests-coverage
        name: Run tests (95% coverage floor)
        entry: >-
          bash -c 'd=$(mktemp -d);
          COVERAGE_FILE="$d/.coverage" uv run pytest --cov=app --cov-fail-under=95 -q;
          rc=$?; rm -rf "$d"; exit $rc'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: conventional-commit
        name: Check conventional commit format
        entry: >
          bash -c '
          MSG=$(head -1 "$1");
          if echo "$MSG" | grep -qE "^release"; then exit 0; fi;
          if echo "$MSG" | grep -qE "^Merge "; then exit 0; fi;
          if ! echo "$MSG" | grep -qE "^(feat|fix|refactor|chore|docs|test|ci|perf|style|build|revert|deps)(\(.+\))?(![:]|[:])" ; then
            echo "Commit message must use conventional commit format";
            echo "  Valid prefixes: feat, fix, refactor, chore, docs, test, ci, perf, style, build, revert, deps";
            echo "  Got: $MSG";
            exit 1;
          fi' --
        language: system
        always_run: true
        stages: [commit-msg]

      - id: strip-co-author
        name: Strip Co-Authored-By lines
        entry: bash -c 'sed -i "/^Co-Authored-By:/d" "$1"' --
        language: system
        always_run: true
        stages: [commit-msg]

      - id: no-external-llm
        name: "Configured LLM endpoint check"  # llm-policy: ignore
        entry: python3 scripts/check_no_external_llm.py
        language: system
        pass_filenames: true
        stages: [pre-commit]

      - id: base-image-digest-pin
        name: "Base image digest-pin check"
        entry: python3 scripts/check_base_image_digest_pin_drift.py
        language: system
        pass_filenames: false
        files: '(Dockerfile.*|scripts/check_base_image_digest_pin_drift\.py)$'
        stages: [pre-commit]

      - id: ci-resource-sizing
        name: "CI resource-sizing guard"
        entry: python3 scripts/check_ci_resource_sizing.py
        language: system
        pass_filenames: false
        files: '(\.github/workflows/.*\.ya?ml|scripts/check_ci_resource_sizing\.py)$'
        stages: [pre-commit]

      - id: host-python312-syntax
        name: "Host-interpreter syntax guard (Python 3.12)"
        entry: uv run --python 3.12 --no-project python -m py_compile
        language: system
        files: ^scripts/.*\.py$
        pass_filenames: true
        stages: [pre-commit]

      - id: no-private-refs
        name: Private reference check
        entry: bash scripts/check-no-internal-refs.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]

      - id: no-private-git-deps
        name: Non-public Git dependency check
        entry: python3 scripts/check_no_private_git_deps.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ci-parity
        name: "CI parity — deterministic CI checks"
        entry: make ci-parity
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: audit-osv
        name: "Dependency-CVE check (OSV-Scanner vs uv.lock)"
        entry: bash scripts/audit_osv.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

  # >>> shared baseline additions (managed; do not hand-edit) >>>
  - repo: local
    hooks:
      - id: agents-md-size-cap
        name: "AGENTS.md Muse 48 KiB cap"
        entry: bash -c 'test $(wc -c < AGENTS.md) -le 49152 || { echo "AGENTS.md exceeds the 49152-byte Muse cap ($(wc -c < AGENTS.md) bytes) — extract into docs/agents/*.md" >&2; exit 1; }' --
        language: system
        pass_filenames: false
        files: ^AGENTS\.md$
        stages: [pre-commit]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos
        args: ["--force-exclude"]

  - repo: local
    hooks:
      - id: shellcheck
        name: "ShellCheck — host binary lints shell scripts"
        entry: shellcheck
        language: system
        types: [shell]
        exclude: \.zsh$
  # <<< shared baseline additions <<<
