
[extend]
useDefault = true

[[allowlists]]
description = "epguides-api structural files (no fixture findings on the current tree)"
condition = "OR"

paths = [
  '''\.gitleaks\.toml$''',
  '''(^|/)uv\.lock$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)__pycache__/''',
  '''\.pyc$''',
]

stopwords = [
  "example",
  "placeholder",
  "changeme",
  "dummy",
  "redacted",
  "your-token-here",
  "xxxxxxxx",
]
