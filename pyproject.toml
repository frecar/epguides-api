[project]
name = "epguides-api"
version = "1.2.0"
description = "REST API for TV show metadata, episodes, and air dates"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [{name = "Fredrik Carlsen", email = "fredrik@carlsen.io"}]
keywords = ["tv", "shows", "api", "epguides", "fastapi"]

dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "redis==8.1.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "httpx==0.28.1",
    "python-dateutil==3.0.0",
    "prometheus-client==0.26.0",
    "sentry-sdk==2.75.0",
    "orjson==3.13.0",
    "setuptools==84.2.1",
    "msgpack>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "pre-commit==4.7.0",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "jsonschema==4.26.0",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py314"
force-exclude = true

[tool.ruff.per-file-target-version]
"scripts/*.py" = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "DTZ",
]
ignore = [
    "E501",
    "B008",
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/tests/*" = ["S101", "DTZ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-q --tb=short"
pythonpath = ["."]
tmp_path_retention_count = 1

[tool.coverage.run]
source = ["app"]
relative_files = true
omit = ["app/tests/*", "app/__init__.py", "app/*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "@overload",
    "class .*\\bProtocol\\):",
    "assert_never\\(",
]
exclude_also = [
    "def __repr__",
    "def __str__",
]
fail_under = 95
show_missing = true
skip_covered = false
precision = 1

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
strict_equality = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-cast", "truthy-bool"]

[[tool.mypy.overrides]]
module = "app.tests.*"
disallow_untyped_defs = false
disable_error_code = ["arg-type", "no-untyped-def"]
